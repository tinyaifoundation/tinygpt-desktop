name: Check source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-clone
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop-clone/package-lock.json
      - run: npm ci
      - name: Use the physical temporary directory
        run: node -e "const fs=require('node:fs'),os=require('node:os'); const p=fs.realpathSync.native(os.tmpdir()); fs.appendFileSync(process.env.GITHUB_ENV, 'TEMP='+p+'\nTMP='+p+'\n'); console.log('Canonical test temporary directory: '+p)"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            desktop-clone/runtimes/work-runtimes
            desktop-clone/runtimes/work-tools
            desktop-clone/runtimes/rag
          key: ${{ runner.os }}-test-runtimes-${{ hashFiles('desktop-clone/src/shared/work-runtimes.json', 'desktop-clone/scripts/work-tools.json', 'desktop-clone/src/shared/rag-models.json') }}
      - run: npm run runtime:work
      - run: npm run runtime:rag
      - run: npm run handbook:check
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run source:audit -- ..
      - run: npm run secrets:check -- ..
