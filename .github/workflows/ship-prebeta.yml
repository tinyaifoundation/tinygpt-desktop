name: Ship Windows pre-beta
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-prebeta-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: prebeta-release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: desktop-clone
        shell: pwsh
    env:
      TINYGPT_PUBLISHER_NAME: ${{ vars.TINYGPT_PUBLISHER_NAME }}
      TINYGPT_SIGNING_ENDPOINT: ${{ vars.TINYGPT_SIGNING_ENDPOINT }}
      TINYGPT_SIGNING_ACCOUNT: ${{ vars.TINYGPT_SIGNING_ACCOUNT }}
      TINYGPT_SIGNING_PROFILE: ${{ vars.TINYGPT_SIGNING_PROFILE }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop-clone/package-lock.json
      - run: npm ci
      - name: Use the physical temporary directory
        run: node -e "const fs=require('node:fs'),os=require('node:os'); const p=fs.realpathSync.native(os.tmpdir()); fs.appendFileSync(process.env.GITHUB_ENV, 'TEMP='+p+'\nTMP='+p+'\n'); console.log('Canonical test temporary directory: '+p)"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            desktop-clone/runtimes/work-runtimes
            desktop-clone/runtimes/work-tools
            desktop-clone/runtimes/rag
          key: ${{ runner.os }}-test-runtimes-${{ hashFiles('desktop-clone/src/shared/work-runtimes.json', 'desktop-clone/scripts/work-tools.json', 'desktop-clone/src/shared/rag-models.json') }}
      - run: npm run runtime:work
      - run: npm run runtime:rag
      - name: Check release configuration
        run: |
          node -e "require('./scripts/release-builder.cjs')"
          if (-not $env:AZURE_CLIENT_ID -or -not $env:AZURE_TENANT_ID -or -not $env:AZURE_SUBSCRIPTION_ID) { throw 'Configure the protected signing environment first.' }
      - run: npm run handbook:check
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run source:audit -- ..
      - run: npm run secrets:check -- ..
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and verify signed release
        run: npm run release:win
      - name: Upload complete release and promote update feed
        run: npm run release:publish
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASE_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
